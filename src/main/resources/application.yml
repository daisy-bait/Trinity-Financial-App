server:
  port: ${PORT}

spring:
  application:
    name: financial_app
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: show
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  pattern:
    dateformat: hh:mm
  level:
    org:
      hibernate:
        sql: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE